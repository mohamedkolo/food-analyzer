# ‏نسخة احتياطية يومية من قاعدة Neon على Cloudflare R2.
#
# ‏ليه هنا: النسخة كانت بتتاخد يدوي من كمبيوتر (tools/backup_db.py)،
# وصاحب المشروع مالوش كمبيوتر -- فبيانات العملاء كانت في نسخة واحدة.
#
# ‏الريبو Public: السجل بيشوفه أي حد، فـ:
#   - النسخة بتتشفّر (gpg) قبل ما تخرج، والمشفّرة بس هي اللي بتترفع.
#   - مفيش artifact (بيتنزّل لأي حد مسجّل) ومفيش set -x.
#   - الأسرار من Settings -> Secrets، مش مكتوبة هنا.
# ‏والتشغيل بيصحّي Neon دقيقة في اليوم -- مش زي ping كل ١٠ دقايق
# (docs/keep-awake.md).
name: DB backup

on:
  schedule:
    - cron: "17 1 * * *"      # ‏كل يوم ٣:١٧ الفجر بتوقيت مصر، والموقع هادي
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Dump, encrypt, upload
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          KEEP: "30"
        run: |
          set -euo pipefail
          for v in DATABASE_URL BACKUP_PASSPHRASE AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ACCOUNT_ID R2_BUCKET; do
            if [ -z "${!v}" ]; then echo "::error::secret missing: $v (Settings -> Secrets and variables -> Actions)"; exit 1; fi
          done
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          NAME="nutrax-$(date -u +%Y-%m-%d_%H%M).sql.gz"
          umask 077
          # ‏pg_dump أحدث من السيرفر بيشتغل؛ الأقدم بيرفض. فنسخة 18 من صورة رسمية.
          docker run --rm -e DATABASE_URL postgres:18 \
            sh -c 'pg_dump --no-owner --no-acl "$DATABASE_URL"' | gzip -9 > "$NAME"
          # ‏نسخة فاضية = pg_dump فشل بصمت. ماترفعهاش على إنها نجحت.
          test -s "$NAME" && [ "$(gzip -dc "$NAME" | head -c 200000 | grep -c 'CREATE TABLE' || true)" -gt 0 ] \
            || { echo "::error::the dump is empty"; exit 1; }
          gpg --batch --yes --symmetric --cipher-algo AES256 --pinentry-mode loopback \
              --passphrase-fd 3 -o "$NAME.gpg" "$NAME" 3<<<"$BACKUP_PASSPHRASE"
          rm -f "$NAME"
          aws s3 cp "$NAME.gpg" "s3://$R2_BUCKET/$NAME.gpg" --endpoint-url "$ENDPOINT" --only-show-errors
          echo "uploaded $NAME.gpg ($(du -h "$NAME.gpg" | cut -f1))"
          # ‏آخر KEEP نسخة بس: الأقدم بتتمسح (R2 ببلاش لحد ١٠ جيجا)
          aws s3api list-objects-v2 --bucket "$R2_BUCKET" --prefix nutrax- --endpoint-url "$ENDPOINT" \
              --query 'Contents[].Key' --output text | tr '\t' '\n' | grep . | sort -r | tail -n +$((KEEP + 1)) \
            | while read -r key; do
                aws s3api delete-object --bucket "$R2_BUCKET" --key "$key" --endpoint-url "$ENDPOINT" >/dev/null
                echo "removed old $key"
              done

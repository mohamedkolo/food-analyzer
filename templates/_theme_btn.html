{#- ‏زرار الشمس/القمر. الشغل نفسه في _theme.html (nxToggleTheme). -#}
<button type="button" class="nx-theme-btn" data-theme-toggle aria-pressed="false" onclick="nxToggleTheme()"
        aria-label="{{ 'تبديل الوضع الغامق' if is_ar else 'Toggle dark mode' }}"
        title="{{ 'فاتح / غامق' if is_ar else 'Light / dark' }}">
  <svg class="nx-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
  <svg class="nx-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
</button>
